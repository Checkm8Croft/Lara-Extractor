# This workflow builds, publishes (win-x64) Debug and Release, zips outputs and uploads both zips
# to an existing GitHub release with tag "lara", replacing existing assets with the same names.

name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: "Lara Extractor.slnx"
      Test_Project_Path: "Lara Extractor\\Lara Extractor.csproj"
      Configuration: ${{ matrix.configuration }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Make TombLib available from C:\Tomb Editor
      shell: powershell
      run: |
        $dst = 'C:\Tomb Editor'
        New-Item -ItemType Directory -Force -Path $dst | Out-Null

        $src = Join-Path $Env:GITHUB_WORKSPACE 'Lara Extractor\TombLib.dll'
        if (Test-Path $src) {
          Copy-Item -Path $src -Destination (Join-Path $dst 'TombLib.dll') -Force
          Write-Host "Copied TombLib.dll to $dst"
        } else {
          Write-Error "TombLib.dll not found at $src"
          exit 1
        }

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Execute unit tests
      run: dotnet test

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    # Publish the app to a deterministic folder per-configuration
    - name: Publish app (${{ matrix.configuration }})
      shell: powershell
      run: |
        $proj = 'Lara Extractor\Lara Extractor.csproj'
        $artifactsRoot = Join-Path $Env:GITHUB_WORKSPACE 'artifacts'
        $out = Join-Path $artifactsRoot $Env:Configuration
        if (-Not (Test-Path $out)) { New-Item -ItemType Directory -Force -Path $out | Out-Null }
        Write-Host "Publishing $proj configuration=$Env:Configuration to $out"
        # You can change the RID (win-x64) if you target different platform(s)
        dotnet publish $proj -c $Env:Configuration -r win-x64 --self-contained false -o $out

    - name: Zip published output
      shell: powershell
      run: |
        $artifactsRoot = Join-Path $Env:GITHUB_WORKSPACE 'artifacts'
        $outDir = Join-Path $artifactsRoot $Env:Configuration

        if (-Not (Test-Path $outDir)) {
          Write-Error "Publish output not found at $outDir"
          exit 1
        }

        $zipName = 'LaraExtractor-' + $Env:Configuration + '.zip'
        $zipPath = Join-Path $artifactsRoot $zipName

        if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

        Write-Host "Creating zip $zipPath from $outDir"

        # Compress the published files (preserve folder contents)
        Get-ChildItem -Path $outDir -Recurse | Compress-Archive -DestinationPath $zipPath -Force

    - name: Upload artifact (zip)
      uses: actions/upload-artifact@v4
      with:
        name: LaraExtractor-${{ matrix.configuration }}
        path: artifacts/LaraExtractor-${{ matrix.configuration }}.zip

  upload-to-release:
    needs: build
    runs-on: windows-latest
    steps:
    - name: Checkout (needed to set workspace path)
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Upload zips to existing release 'lara' (replace assets)
      if: success()
      shell: powershell
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tag = 'lara'
        $repoFull = $Env:GITHUB_REPOSITORY
        
        Write-Host "Looking up release with tag '$tag' in $repoFull"
        $apiUrl = "https://api.github.com/repos/$repoFull/releases/tags/$tag"
        try {
          $release = Invoke-RestMethod -Method Get -Uri $apiUrl -Headers @{ Authorization = "token $env:GITHUB_TOKEN"; "User-Agent" = "github-actions" }
        } catch {
          Write-Error "Release with tag '$tag' not found or API access failed: $_"
          exit 1
        }
        
        $releaseId = $release.id
        Write-Host "Found release id: $releaseId"
        
        $artifactsDir = Join-Path $Env:GITHUB_WORKSPACE 'artifacts'
        
        # Diagnostic: list what's in artifacts (helps debug)
        if (Test-Path $artifactsDir) {
          Write-Host ("Contents of ${artifactsDir}:")
          Get-ChildItem -Path $artifactsDir -Recurse | ForEach-Object { Write-Host $_.FullName }
        } else {
          Write-Host ("Artifacts directory does not exist: ${artifactsDir}")
        }
        
        # Find zip files recursively (download-artifact typically creates subfolders per-artifact)
        $zips = Get-ChildItem -Path $artifactsDir -Filter '*.zip' -File -Recurse -ErrorAction SilentlyContinue
        if (-not $zips -or $zips.Count -eq 0) {
          Write-Error "No zip artifacts found in ${artifactsDir} (searched recursively)."
          exit 1
        }
        
        foreach ($zip in $zips) {
          Write-Host ("Preparing to upload " + $zip.Name + " (full path: " + $zip.FullName + ")")
          # If an asset with same name exists, delete it so we replace it
          $existing = $release.assets | Where-Object { $_.name -eq $zip.Name }
          if ($existing) {
            Write-Host ("Existing asset found (id=" + $existing.id + "). Deleting before upload...")
            $deleteUrl = "https://api.github.com/repos/$repoFull/releases/assets/$($existing.id)"
            Invoke-RestMethod -Method Delete -Uri $deleteUrl -Headers @{ Authorization = "token $env:GITHUB_TOKEN"; "User-Agent" = "github-actions" }
          }
        
          $uploadUrl = "https://uploads.github.com/repos/$repoFull/releases/$releaseId/assets?name=$($zip.Name)"
          Write-Host ("Uploading " + $zip.FullName + " to " + $uploadUrl)
          Invoke-RestMethod -Method Post -Uri $uploadUrl -Headers @{ Authorization = "token $env:GITHUB_TOKEN"; "User-Agent" = "github-actions"; "Content-Type" = "application/zip" } -InFile $zip.FullName -UseBasicParsing
          Write-Host ($zip.Name + " uploaded.")
        }
